services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cia
      POSTGRES_PASSWORD: cia_dev_password
      POSTGRES_DB: cia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cia -d cia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
